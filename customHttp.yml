customHeaders:
  - pattern: "/netscape/Build/*.loader.js"
    headers:
      - key: "Content-Type"
        value: "application/javascript"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  - pattern: "/netscape/Build/*.unityweb"
    headers:
      - key: "Content-Type"
        value: "application/octet-stream"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  - pattern: "/netscape/index.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=300, must-revalidate"
