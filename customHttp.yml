customHeaders:
  - pattern: "/netscape/Build/*.wasm.br"
    headers:
      - key: "Content-Type"
        value: "application/wasm"
      - key: "Content-Encoding"
        value: "br"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  - pattern: "/netscape/Build/*.data.br"
    headers:
      - key: "Content-Type"
        value: "application/octet-stream"
      - key: "Content-Encoding"
        value: "br"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  - pattern: "/netscape/Build/*.js.br"
    headers:
      - key: "Content-Type"
        value: "application/javascript"
      - key: "Content-Encoding"
        value: "br"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  - pattern: "/netscape/Build/*.symbols.json.br"
    headers:
      - key: "Content-Type"
        value: "application/octet-stream"
      - key: "Content-Encoding"
        value: "br"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  - pattern: "/netscape/index.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=300, must-revalidate"
